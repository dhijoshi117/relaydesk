<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RelayDesk · Support queue</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<header><div class="brand"><span class="mark" aria-hidden="true">↗</span> RelayDesk</div><a href="/docs">API reference ↗</a></header>
<main>
<section class="intro">
<div><p class="eyebrow">IT SERVICE DESK</p><h1>Support queue</h1><p>Track requests from intake to resolution.</p></div>
<button type="button" id="new">+ New ticket</button>
</section>
<div class="metrics" id="metrics"></div>
<section class="panel">
<div class="toolbar"><h2>Tickets</h2><div class="filters">
<input id="search" aria-label="Search tickets" placeholder="Search tickets">
<select id="status" aria-label="Filter by status"><option value="">All statuses</option><option>Open</option><option>In progress</option><option>Resolved</option></select>
</div></div>
<p id="page-error" role="alert"></p>
<div class="table"><table><thead><tr><th>Ticket</th><th>Category</th><th>Priority</th><th>Status</th></tr></thead><tbody id="tickets"></tbody></table></div>
</section>
</main>
<dialog id="editor" aria-labelledby="editor-title">
<div class="dialog-title"><h2 id="editor-title">New ticket</h2><button type="button" class="close" aria-label="Close">×</button></div>
<form id="create">
<label>Title<input name="title" minlength="3" maxlength="100" required></label>
<label>Description<textarea name="description" minlength="3" maxlength="2000" required></textarea></label>
<div class="form-row"><label>Category<select name="category"><option>Network</option><option>Access</option><option>Hardware</option><option>Software</option></select></label>
<label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Low</option></select></label></div>
<p id="create-error" role="alert"></p><button>Create ticket</button>
</form>
</dialog>
<dialog id="details" aria-labelledby="detail-title">
<div class="dialog-title"><h2 id="detail-title">Ticket details</h2><button type="button" class="close" aria-label="Close">×</button></div>
<div id="detail-body"></div><p id="detail-error" role="alert"></p>
</dialog>
</body></html>
